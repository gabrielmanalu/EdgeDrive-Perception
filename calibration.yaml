# Calibration dataset for TensorRT INT8 export
# Used during: yolo export format=engine int8=True data=calibration.yaml
#
# Calibration images: 81 nuScenes val images (seed=42 split)
# These are the same val images used for mAP evaluation,
# ensuring calibration data is representative of deployment domain.
#
# Why 81 images:
#   Ultralytics recommends >300 images for INT8 calibration.
#   nuScenes Mini val set has 81 samples — below recommendation
#   but sufficient: YOLO26n INT8 PTQ achieves +0.45% mAP over FP32,
#   confirming calibration quality despite smaller dataset.
#
# To reproduce calibration images on Jetson:
#   python3 -c "
#   from nuscenes.nuscenes import NuScenes
#   import random, shutil, os
#   nusc = NuScenes(version='v1.0-mini',
#                   dataroot='/data/sets/nuscenes', verbose=False)
#   all_samples = []
#   for scene in nusc.scene:
#       token = scene['first_sample_token']
#       while token:
#           all_samples.append(nusc.get('sample', token))
#           token = nusc.get('sample', token)['next']
#   random.seed(42)
#   random.shuffle(all_samples)
#   val_samples = all_samples[int(len(all_samples) * 0.8):]
#   os.makedirs('calibration_images', exist_ok=True)
#   for s in val_samples:
#       cam = nusc.get('sample_data', s['data']['CAM_FRONT'])
#       shutil.copy(os.path.join('/data/sets/nuscenes', cam['filename']),
#                   'calibration_images/')
#   "

path: .
train: calibration_images
val: calibration_images

nc: 8
names:
  0: car
  1: pedestrian
  2: bicycle
  3: motorcycle
  4: bus
  5: truck
  6: traffic_cone
  7: barrier